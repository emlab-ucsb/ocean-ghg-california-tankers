name: Render and Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual re-renders from the Actions tab

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push to gh-pages branch

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
            libtiff5-dev libjpeg-dev libgdal-dev gdal-bin libgeos-dev \
            libproj-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::bigrquery
            any::DBI
            any::here
            any::glue
            any::gt
            any::DT
            any::plotly
            any::scales
            any::lubridate
            any::sf
            any::leaflet
            any::htmltools
            any::sessioninfo

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Verify data file exists
        run: |
          DATA_FILE="data/california_tanker_emissions.csv"
          if [ ! -f "$DATA_FILE" ]; then
            echo "ERROR: Required data file '$DATA_FILE' not found."
            echo ""
            echo "The CSV data file is not tracked by Git. To make it available:"
            echo "  1. Temporarily commit the CSV, push, and re-run this workflow; or"
            echo "  2. Upload it as a GitHub Release artifact and add a download step; or"
            echo "  3. Store it as a base64-encoded repository secret and decode it here."
            exit 1
          fi
          echo "Data file found: $DATA_FILE ($(wc -l < $DATA_FILE) rows)"

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
